[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starfield-resource-reproducer"
version = "1.0.0"
description = "Reference implementation of Starfield's planetary resource-generation algorithm"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/gooberpede/starfield-resource-reproducer"
Research = "https://github.com/gooberpede/starfield-resource-research"
Issues = "https://github.com/gooberpede/starfield-resource-reproducer/issues"

[project.scripts]
starfield-resource-reproducer = "starfield_resource_reproducer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
